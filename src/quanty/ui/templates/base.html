<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}quanty{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 13 L5 8 L9 10 L15 3' fill='none' stroke='%232a78d6' stroke-width='2.5'/%3E%3C/svg%3E">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    try { const r = sessionStorage.getItem("tab:run"); if (r) document.documentElement.dataset.tabRun = r; } catch (e) {}
  </script>
  <script>
    // pause auto-refresh while a confirmation is being typed (it would be wiped)
    function quantyMayRefresh() {
      const box = document.querySelector(".controls input[name=confirm]");
      return !box || (document.activeElement !== box && box.value === "");
    }
  </script>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/chart.js" defer></script>
  <script src="/static/tabs.js"></script>
</head>
<body>
  <header>
    <span class="brand">quanty</span>
    <nav>
      <a href="/" {% if page == "overview" %}aria-current="page"{% endif %}>Runs</a>
      <a href="/feeds" {% if page == "feeds" %}aria-current="page"{% endif %}>Feeds</a>
    </nav>
    <button type="button" id="theme" aria-label="Switch light or dark theme">Theme</button>
  </header>
  {# the whole main element refreshes itself; the page stays usable without JavaScript #}
  <main hx-get="{{ request.url.path }}" hx-select="main" hx-swap="outerHTML"
        hx-trigger="every {{ refresh_s }}s [quantyMayRefresh()]">
    {% block main %}{% endblock %}
  </main>
  <script>
    document.getElementById("theme").addEventListener("click", () => {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });
  </script>
</body>
</html>
