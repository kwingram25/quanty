# Publish quanty-py. A version tag (v0.1.0, matching quanty.__version__) publishes to PyPI; running
# this by hand (Actions > release > Run workflow) publishes to TestPyPI, to try a release first.
# Both use trusted publishing: PyPI trusts this workflow, so no token is stored anywhere. Set it up
# once per index (pypi.org and test.pypi.org: your project > Publishing > add a GitHub publisher:
# this repository, workflow release.yml, environment pypi or testpypi).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: the tag is the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/quanty/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $version" >&2; exit 1; }
      - run: uv build
      - name: the packages are well formed
        run: uvx twine check --strict dist/*
      - name: the wheel installs and runs, with its dashboard, migrations and template
        run: |
          uv venv /tmp/try --python 3.12
          uv pip install --python /tmp/try dist/*.whl
          /tmp/try/bin/quanty demo --hours 0.5
          /tmp/try/bin/python -c "
          from importlib import resources
          q = resources.files('quanty')
          assert (q / 'ui' / 'dist' / 'index.html').is_file()
          assert (q / 'strategies' / '_template.py').is_file()
          assert any((q / 'db' / 'migrations' / 'versions').iterdir())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
