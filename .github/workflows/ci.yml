name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build   # type-checks, then builds into src/quanty/ui/dist
        working-directory: web
      - name: the committed build matches the source
        run: git diff --exit-code --stat -- src/quanty/ui/dist && test -z "$(git status --porcelain -- src/quanty/ui/dist)"

  deploy:
    # a project from `quanty init` builds and runs as its README says: image, trader, dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: create a project (vendors a wheel of this commit)
        run: uv run quanty init "$RUNNER_TEMP/proj" --yes --venue polymarket_us
      - name: build the image and backtest inside it
        working-directory: ${{ runner.temp }}/proj
        run: |
          docker build -t quanty-proj .
          docker run --rm quanty-proj demo --hours 0.5
      - name: compose starts the trader and a dashboard that answers
        working-directory: ${{ runner.temp }}/proj
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/runs && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/ | grep -q 'id="root"'
          docker compose ps
          docker compose down

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git --redact --verbose .
