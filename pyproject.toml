[project]
name = "quanty"
version = "0.0.1"
description = "Self-hosted framework for recording, backtesting, paper and live trading of repeated prediction markets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Ingram" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "fastapi>=0.115",
    "hdrhistogram>=0.10",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.3",
    "orjson>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sortedcontainers>=2.4",
    "sqlalchemy>=2.0",
    "structlog>=24",
    "tenacity>=9",
    "tomlkit>=0.15.2",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
quanty = "quanty.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quanty"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow − × in prose

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hdrh.*", "sortedcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["tests"]
addopts = "-q"
