[project]
# installed as quanty-py (the name "quanty" on PyPI is another project); imported and run as quanty
name = "quanty-py"
dynamic = ["version"]  # quanty.__version__, in src/quanty/__init__.py
description = "Self-hosted framework for recording, backtesting, paper and live trading of repeated prediction markets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Ingram" }]
requires-python = ">=3.12"
keywords = ["trading", "prediction markets", "kalshi", "polymarket", "backtesting", "paper trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.3",
    "orjson>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sortedcontainers>=2.4",
    "sqlalchemy>=2.0",
    "structlog>=24",
    "tenacity>=9",
    "tomlkit>=0.15.2",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.urls]
Repository = "https://github.com/kwingram25/quanty"
Documentation = "https://github.com/kwingram25/quanty/tree/main/docs"
Issues = "https://github.com/kwingram25/quanty/issues"

[project.scripts]
quanty = "quanty.launch:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/quanty/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quanty"]

[tool.hatch.build.targets.sdist]
# what building and testing the Python package needs: the dashboard ships built, inside src/
include = ["/src/quanty", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow − × in prose

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sortedcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["tests"]
addopts = "-q"
