[project]
name = "quanty"
version = "0.0.1"
description = "Self-hosted framework for recording, backtesting, paper and live trading of repeated prediction markets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Ingram" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.scripts]
quanty = "quanty.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quanty"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow − × in prose

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
