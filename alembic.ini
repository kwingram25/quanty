# Dev-only: lets `uv run alembic revision --autogenerate` diff the models against a scratch DB.
# quanty itself migrates databases in code (quanty.db.connect), not through this file.
[alembic]
script_location = src/quanty/db/migrations
sqlalchemy.url = sqlite:///.alembic-dev.sqlite
file_template = %%(rev)s_%%(slug)s
