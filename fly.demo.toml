# The public demo on Fly.io: synthetic markets, shared by everyone viewing it. From the repo root:
#   fly apps create quanty-demo          (the name must be unique on Fly; change it here too)
#   fly deploy --config fly.demo.toml --ha=false
# It stops when nobody's visiting and starts on the next request (a fresh day each time), and
# restarts every 6 hours while in use (quanty demo --public --reset-hours).
app = "quanty-demo"
primary_region = "iad"

[build]
  dockerfile = "demo.Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[restart]]
  policy = "always"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
