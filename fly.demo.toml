# The public demo on Fly.io: synthetic markets, shared by everyone viewing it. From the repo root:
#   fly apps create quanty-demo          (the name must be unique on Fly; change it here too)
#   fly deploy --config fly.demo.toml --ha=false
# One machine stays running (a shared CPU's baseline covers the demo; stopped, every visitor would
# wait minutes for its history to rebuild on a throttled CPU), and it starts a fresh day every 6
# hours (quanty demo --public --reset-hours).
app = "quanty-demo"
primary_region = "iad"

[build]
  dockerfile = "demo.Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[restart]]
  policy = "always"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 2   # one ran out of its burst allowance within the hour at 10x, then crawled (6% of a core)
